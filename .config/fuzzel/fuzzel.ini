terminal="/bin/kitty"
font="Mononoki Nerd Font Mono:size=16"
use-bold="yes"
prompt="SEARCH: "
#message=""
#placeholder=""

show-actions="no"
list-executables-in-path="no"

anchor="center"
x-margin="0"
y-margin="0"

width="50"
lines="20"

horizontal-pad="50"

keyboard-focus="on-demand"
exit-on-keyboard-focus-loss="no"

[colors]
background=282a36dd
text=f8f8f2ff
match=8be9fdff
selection-match=8be9fdff
selection=44475add
selection-text=f8f8f2ff
border=bd93f9ff

[border]
width="3"
radius="15"
